<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard | Properti</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
  <h1>Dashboard Admin</h1>
</header>

<section class="listing">
  <h2>Tambah Listing Tanah</h2>

  <form id="productForm" class="admin-form">
    <input type="text" id="title" placeholder="Judul Tanah" required>
    <input type="text" id="location" placeholder="Lokasi" required>
    <input type="number" id="landSize" placeholder="Luas (m²)" required>
    <input type="text" id="price" placeholder="Harga">
    <input type="text" id="legal" placeholder="Legalitas (SHM/HGB)">
    <input type="text" id="image" placeholder="URL Foto">
    <input type="text" id="youtube" placeholder="Link YouTube Embed">
    <textarea id="description" placeholder="Deskripsi"></textarea>
    <button type="submit" class="btn-primary">Simpan Produk</button>
  </form>

  <div id="adminList"></div>
</section>

<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
